<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 今日點餐籤</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5FC;--ink:#232447;--sub:#5A5D82;--pu:#5B54C8;--pu2:#4A43B8;--pul:#E8E6FA;--gr:#35A79B;--grl:#DFF1EE;--co:#E8735F;--col:#FBE7E2;--am:#E9A13B;--line:#D6D2EE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(circle at 100% 0,rgba(91,84,200,.18),transparent 40%),radial-gradient(circle at 0 100%,rgba(53,167,155,.16),transparent 40%)}
main{max-width:480px;margin:0 auto;padding:28px 16px 48px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--pul);color:var(--pu2);font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--co)}
h1{font-size:30px;font-weight:900;line-height:1.3;margin:14px 0 8px}
h1 em{font-style:normal;background:linear-gradient(180deg,transparent 62%,rgba(233,161,59,.42) 62%)}
.lead{color:var(--sub);font-size:16px;line-height:1.7}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 14px 36px rgba(35,36,71,.08);padding:20px;margin-top:16px}
.q{font-weight:900;font-size:18px;margin-bottom:12px}
input[type=date]{width:100%;font:inherit;font-size:18px;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opts button{font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 6px;cursor:pointer}
.opts button.on{background:var(--pu);border-color:var(--pu);color:#fff}
.go{display:block;width:100%;margin-top:22px;font:inherit;font-size:19px;font-weight:900;color:#fff;background:var(--pu);border:0;border-radius:999px;padding:16px;cursor:pointer;box-shadow:0 10px 24px rgba(91,84,200,.35)}
.go:disabled{background:#B9B6DD;box-shadow:none}
.ghost{display:block;width:100%;margin-top:18px;font:inherit;font-size:16px;font-weight:700;color:var(--pu2);background:#fff;border:2px dashed var(--pu);border-radius:999px;padding:12px;cursor:pointer}
#think{text-align:center;padding-top:80px}
.orb{width:96px;height:96px;margin:0 auto 26px;border-radius:50%;background:conic-gradient(var(--pu),var(--gr),var(--am),var(--co),var(--pu));animation:spin 1s linear infinite;mask:radial-gradient(circle,transparent 52%,#000 54%);-webkit-mask:radial-gradient(circle,transparent 52%,#000 54%)}
@keyframes spin{to{transform:rotate(1turn)}}
#steps p{color:var(--sub);font-size:16px;line-height:2;opacity:0;transition:opacity .3s}
#steps p.show{opacity:1}
.tile{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.t-pu{background:var(--pul);color:var(--pu2)}.t-gr{background:var(--grl);color:#23786F}.t-co{background:var(--col);color:#B44A37}
.hero{background:var(--pu);border-color:var(--pu);color:#fff}
.hero .lab{font-size:14px;font-weight:700;opacity:.8}
.hero .shop{font-size:15px;font-weight:700;opacity:.9;margin-top:2px}
.hero .big{font-size:24px;font-weight:900;line-height:1.35}
.hero .meta{font-size:14px;opacity:.85;margin-top:2px}
.hero hr{border:0;border-top:1px dashed rgba(255,255,255,.4);margin:14px 0}
.say{font-size:17px;font-weight:700;line-height:1.75}
.rows{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px;align-items:center}
.rows dt{color:var(--sub);font-weight:700}
.star{color:var(--am);letter-spacing:2px}.star i{font-style:normal;color:#DAD7EC}
.sw{display:inline-block;width:16px;height:16px;border-radius:5px;vertical-align:-2px;margin-right:6px;border:1px solid rgba(0,0,0,.1)}
.so{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--bg);font-size:15px;line-height:1.7}
.so b{color:var(--pu2)}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:18px;line-height:1.6}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>

<section id="ask">
  <span class="pill">智慧服務業解析・課堂小活動</span>
  <h1>AI 今日點餐籤：<br>算出你今天<em>該吃什麼</em></h1>
  <p class="lead">輸入生日，AI 依你的星座、生肖和今日運勢，從德明周邊店家挑出你今天的幸運飲料與午餐。</p>
  <div class="card"><p class="q">你的生日</p><input type="date" id="bd" min="1960-01-01"></div>
  <div class="card"><p class="q">性別</p><div class="opts" id="sex"><button>男</button><button>女</button><button>不想說</button></div></div>
  <button class="go" id="go" disabled>填好生日和性別就能算</button>
</section>

<section id="think" hidden><div class="orb"></div><div id="steps"></div></section>

<section id="result" hidden>
  <span class="pill" id="today"></span>
  <h1 id="who"></h1>

  <div class="card hero">
    <p class="lab">今日適合的飲料</p>
    <p class="shop" id="dShop"></p><p class="big" id="dItem"></p><p class="meta" id="dMeta"></p>
    <hr>
    <p class="lab">今日適合的餐點</p>
    <p class="shop" id="mShop"></p><p class="big" id="mItem"></p><p class="meta" id="mMeta"></p>
  </div>

  <div class="card"><span class="tile t-co">今日運勢</span><p class="say" id="say"></p></div>

  <div class="card">
    <span class="tile t-pu" id="signTag"></span>
    <dl class="rows" id="stars"></dl>
    <dl class="rows" style="margin-top:12px">
      <dt>幸運色</dt><dd id="color"></dd>
      <dt>幸運物</dt><dd id="thing"></dd>
      <dt>幸運數字</dt><dd id="num"></dd>
    </dl>
    <p class="so" id="dWhy"></p>
  </div>

  <div class="card">
    <span class="tile t-gr" id="zodTag"></span>
    <dl class="rows">
      <dt>今日宜</dt><dd id="yi"></dd>
      <dt>今日忌</dt><dd id="ji"></dd>
      <dt>幸運方位</dt><dd id="dir"></dd>
    </dl>
    <p class="so" id="mWhy"></p>
  </div>

  <button class="ghost" id="again">換個生日再算一次</button>
  <p class="foot">店家資訊查於 2026 年 10 月，營業時間與價格以店家現場為準。</p>
</section>

</main>

const THING=['悠遊卡','藍色原子筆','耳機','保溫瓶','便利貼','帆布袋','學生證','行動電源','十元硬幣','髮圈','摺疊傘','筆電貼紙'];
const SUGAR=['無糖','一分糖','微糖','半糖','少糖'],ICE=['去冰','微冰','少冰','正常冰'];
const STEPS=['對照今日星象…','推算生肖流日…','掃描德明周邊 56 家店…','計算幸運色與甜度…','產生你的今日點餐籤…'];

const $=id=>document.getElementById(id);
let sex='';
const today=new Date();today.setHours(0,0,0,0);
$('bd').max=today.toISOString().slice(0,10);
document.querySelectorAll('#sex button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#sex button').forEach(x=>x.classList.remove('on'));b.classList.add('on');sex=b.textContent;ready();});
$('bd').oninput=ready;
function ready(){const ok=$('bd').value&&sex;$('go').disabled=!ok;$('go').textContent=ok?'開始算':'填好生日和性別就能算';}

function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);h^=h>>>16;h=Math.imul(h,0x85ebca6b);h^=h>>>13;h=Math.imul(h,0xc2b2ae35);h^=h>>>16;return h>>>0;} // FNV＋收尾混洗，避免只差一個字的輸入抽到一樣
const at=(arr,n)=>arr[n%arr.length];

$('go').onclick=()=>{
  $('ask').hidden=true;$('think').hidden=false;scrollTo(0,0);
  const box=$('steps');box.innerHTML='';
  STEPS.forEach((t,i)=>{const p=document.createElement('p');p.textContent=t;box.appendChild(p);setTimeout(()=>p.classList.add('show'),i*520);});
  setTimeout(show,STEPS.length*520+400);
};

function show(){
  const [y,m,d]=$('bd').value.split('-').map(Number);
  const born=new Date(y,m-1,d);
  const si=(d>=SIGN_START[m-1]?m:m-1)%12, sign=SIGN[si];
  const cny=CNY[y]||'0204', zy=(m*100+d<+cny)?y-1:y, zi=((zy-4)%12+12)%12, zod=ZOD[zi];
  let age=today.getFullYear()-y;if(today<new Date(today.getFullYear(),m-1,d))age--;
  const days=Math.round((today-born)/864e5), num=days%9+1;
  const day=Math.floor(today.getTime()/864e5);
  const hs=hash(day+'s'+si), hz=hash(day+'z'+zi), hx=hash(day+sign+zod+sex+age);

  // 星座 → 幸運色 → 飲料
  const colors=Object.keys(COLOR), ck=at(colors,hs), [cName,cHex,cWhy]=COLOR[ck];
  const pool=[];DRINK.forEach(([shop,walk,items])=>items.forEach(([it,c,coffee])=>c===ck&&pool.push({shop,walk,it,coffee})));
  const dk=at(pool,hx);
  const spec=dk.coffee?(num%2?'冰的':'熱的'):at(SUGAR,num)+'・'+at(ICE,num+1);

  // 生肖 → 今日類別；星座＋生肖＋性別＋年齡 → 哪一家、哪一品
  const cats=Object.keys(CAT), cat=at(cats,hz);
  const shops=MEAL.filter(s=>s[3]===cat), mk=at(shops,hx>>>3), item=at(mk[4],hx>>>7);

  const sexWord=sex==='不想說'?'':sex+'性';
  $('today').textContent=`${today.getFullYear()}.${today.getMonth()+1}.${today.getDate()} 今日運勢`;
  $('who').textContent=`${sign}座・屬${zod}・${age} 歲${sexWord}`;
  $('dShop').textContent=dk.shop;$('dItem').textContent=dk.it;$('dMeta').textContent=`${spec}・走路約 ${dk.walk} 分鐘`;
  $('mShop').textContent=mk[0];$('mItem').textContent=item;$('mMeta').textContent=`校門往${mk[2]}・走路約 ${mk[1]} 分鐘`;

  const sexPool=SAY_SEX[sex]||SAY_SEX.男.concat(SAY_SEX.女);
  $('say').innerHTML=`${sign}座：${at(SAY_SIGN,hs>>>4)}<br>屬${zod}：今天${at(SAY_ZOD,hz>>>4)}<br>${at(sexPool,hx>>>11)}`;

  $('signTag').textContent=sign+'座運勢';
  const st=(k,n)=>`<dt>${k}</dt><dd class="star">${'★'.repeat(n)}<i>${'★'.repeat(5-n)}</i></dd>`;
  $('stars').innerHTML=st('學業',2+(hs>>>8)%4)+st('人緣',2+(hs>>>10)%4)+st('財運',1+(hs>>>12)%5)+st('食運',3+(hs>>>14)%3);
  $('color').innerHTML=`<span class="sw" style="background:${cHex}"></span>${cName}`;
  $('thing').textContent=at(THING,hs>>>16);
  $('num').textContent=num;
  $('dWhy').innerHTML=`幸運色是<b>${cName}</b>，${cWhy}；幸運數字 ${num}，所以推薦你喝 <b>${dk.shop}的${dk.it}</b>，${spec}。`;

  $('zodTag').textContent='屬'+zod+'運勢';
  const yj=at(YIJI,hz>>>8);$('yi').textContent=yj[0];$('ji').textContent=yj[1];
  $('dir').textContent=mk[2];
  $('mWhy').innerHTML=`屬${zod}今天適合<b>${CAT[cat]}</b>，幸運方位在<b>${mk[2]}</b>，所以推薦你吃 <b>${mk[0]}的${item}</b>。`;

  $('think').hidden=true;$('result').hidden=false;scrollTo(0,0);
}
$('again').onclick=()=>{$('result').hidden=true;$('ask').hidden=false;scrollTo(0,0);};
</script>
</body>
